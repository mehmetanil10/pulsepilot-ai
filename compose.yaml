name: ${COMPOSE_PROJECT_NAME:-pulsepilot}

x-api-build: &api-build
  context: .
  dockerfile: Dockerfile
  target: final
  args:
    BUILD_CREATED: ${BUILD_CREATED:-unknown}
    BUILD_REVISION: ${BUILD_REVISION:-unknown}
    BUILD_VERSION: ${BUILD_VERSION:-dev}

x-migration-build: &migration-build
  context: .
  dockerfile: Dockerfile
  target: migration-final
  args:
    BUILD_CREATED: ${BUILD_CREATED:-unknown}
    BUILD_REVISION: ${BUILD_REVISION:-unknown}
    BUILD_VERSION: ${BUILD_VERSION:-dev}

x-worker-build: &worker-build
  context: .
  dockerfile: Dockerfile
  target: worker-final
  args:
    BUILD_CREATED: ${BUILD_CREATED:-unknown}
    BUILD_REVISION: ${BUILD_REVISION:-unknown}
    BUILD_VERSION: ${BUILD_VERSION:-dev}

x-web-build: &web-build
  context: ./src/PulsePilot.Web
  dockerfile: Dockerfile
  args:
    BUILD_CREATED: ${BUILD_CREATED:-unknown}
    BUILD_REVISION: ${BUILD_REVISION:-unknown}
    BUILD_VERSION: ${BUILD_VERSION:-dev}

x-app-hardening: &app-hardening
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: ${APP_PIDS_LIMIT:-256}

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  ASPNETCORE_HTTP_PORTS: "8080"
  ConnectionStrings__Database: >-
    Host=database;Port=5432;Database=${POSTGRES_DB:-pulsepilot};Username=${POSTGRES_USER:-pulsepilot};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Include Error Detail=false
  Jwt__Issuer: ${JWT_ISSUER:-PulsePilot.Api}
  Jwt__Audience: ${JWT_AUDIENCE:-PulsePilot.Clients}
  Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
  Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
  OpenAI__Enabled: ${OPENAI_ENABLED:-false}
  OpenAI__ApiKey: ${OPENAI_API_KEY:-}
  OpenAI__Model: ${OPENAI_MODEL:-gpt-5.6-luna}
  OpenAI__EmbeddingModel: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  OpenAI__EmbeddingDimensions: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
  OpenAI__Endpoint: ${OPENAI_ENDPOINT:-https://api.openai.com/v1/}
  OpenAI__MaxOutputTokenCount: ${OPENAI_MAX_OUTPUT_TOKENS:-1000}
  OpenAI__NetworkTimeoutSeconds: ${OPENAI_NETWORK_TIMEOUT_SECONDS:-30}
  OpenTelemetry__OtlpEnabled: ${OTEL_EXPORTER_OTLP_ENABLED:-false}
  OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
  ApiProtection__RateLimitingEnabled: ${API_RATE_LIMITING_ENABLED:-true}
  ApiProtection__GeneralPermitLimit: ${API_GENERAL_PERMIT_LIMIT:-240}
  ApiProtection__AuthenticationPermitLimit: ${API_AUTH_PERMIT_LIMIT:-10}
  ApiProtection__AiPermitLimit: ${API_AI_PERMIT_LIMIT:-20}
  ApiProtection__WindowSeconds: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
  ApiProtection__QueueLimit: ${API_RATE_LIMIT_QUEUE_LIMIT:-0}
  ApiProtection__MaxRequestBodyBytes: ${API_MAX_REQUEST_BODY_BYTES:-65536}
  SemanticSearch__SimilarityThreshold: ${SIMILARITY_THRESHOLD:-0.80}
  SemanticSearch__DefaultLimit: ${SIMILARITY_DEFAULT_LIMIT:-10}
  SemanticSearch__MaxLimit: ${SIMILARITY_MAX_LIMIT:-50}
  FeedbackStatistics__DefaultPeriodDays: ${FEEDBACK_STATISTICS_DEFAULT_PERIOD_DAYS:-7}
  FeedbackStatistics__MaxPeriodDays: ${FEEDBACK_STATISTICS_MAX_PERIOD_DAYS:-365}
  TrendingIssues__DefaultPeriodDays: ${TRENDING_ISSUES_DEFAULT_PERIOD_DAYS:-7}
  TrendingIssues__MaxPeriodDays: ${TRENDING_ISSUES_MAX_PERIOD_DAYS:-365}
  TrendingIssues__DefaultLimit: ${TRENDING_ISSUES_DEFAULT_LIMIT:-10}
  TrendingIssues__MaxLimit: ${TRENDING_ISSUES_MAX_LIMIT:-50}
  CustomerResponseDrafting__MaxAttempts: ${CUSTOMER_RESPONSE_DRAFT_MAX_ATTEMPTS:-2}
  CustomerResponseDrafting__TimeoutSeconds: ${CUSTOMER_RESPONSE_DRAFT_TIMEOUT_SECONDS:-30}
  CustomerResponseDrafting__RetryDelayMilliseconds: ${CUSTOMER_RESPONSE_DRAFT_RETRY_DELAY_MS:-250}
  ReportGeneration__DefaultPeriodDays: ${REPORT_GENERATION_DEFAULT_PERIOD_DAYS:-7}
  ReportGeneration__MaxPeriodDays: ${REPORT_GENERATION_MAX_PERIOD_DAYS:-90}
  ReportGeneration__DefaultTrendingIssueLimit: ${REPORT_GENERATION_DEFAULT_TREND_LIMIT:-5}
  ReportGeneration__MaxTrendingIssueLimit: ${REPORT_GENERATION_MAX_TREND_LIMIT:-10}
  ReportGeneration__MaxAttempts: ${REPORT_GENERATION_MAX_ATTEMPTS:-2}
  ReportGeneration__TimeoutSeconds: ${REPORT_GENERATION_TIMEOUT_SECONDS:-30}
  ReportGeneration__RetryDelayMilliseconds: ${REPORT_GENERATION_RETRY_DELAY_MS:-250}
  AgentOrchestration__MaxTurns: ${AGENT_MAX_TURNS:-6}
  AgentOrchestration__MaxToolCallsPerTurn: ${AGENT_MAX_TOOL_CALLS_PER_TURN:-4}
  AgentOrchestration__MaxTotalToolCalls: ${AGENT_MAX_TOTAL_TOOL_CALLS:-12}
  AgentOrchestration__ExecutionTimeoutSeconds: ${AGENT_EXECUTION_TIMEOUT_SECONDS:-90}
  AgentOrchestration__MaxUserMessageLength: ${AGENT_MAX_USER_MESSAGE_LENGTH:-4000}
  AgentOrchestration__MaxFinalAnswerLength: ${AGENT_MAX_FINAL_ANSWER_LENGTH:-8000}
  AgentOrchestration__MaxToolArgumentsLength: ${AGENT_MAX_TOOL_ARGUMENTS_LENGTH:-8000}
  AgentOrchestration__MaxToolOutputLength: ${AGENT_MAX_TOOL_OUTPUT_LENGTH:-20000}
  PriorityScoring__SeverityWeight: ${PRIORITY_SEVERITY_WEIGHT:-0.35}
  PriorityScoring__FrequencyWeight: ${PRIORITY_FREQUENCY_WEIGHT:-0.30}
  PriorityScoring__CustomerImpactWeight: ${PRIORITY_CUSTOMER_IMPACT_WEIGHT:-0.20}
  PriorityScoring__RecencyWeight: ${PRIORITY_RECENCY_WEIGHT:-0.15}
  PriorityScoring__FrequencyNormalizationCount: ${PRIORITY_FREQUENCY_NORMALIZATION_COUNT:-20}
  PriorityScoring__CustomerImpactNormalizationCount: ${PRIORITY_CUSTOMER_IMPACT_NORMALIZATION_COUNT:-10}
  PriorityScoring__RecencyWindowDays: ${PRIORITY_RECENCY_WINDOW_DAYS:-7}
  PriorityScoring__P1Threshold: ${PRIORITY_P1_THRESHOLD:-75}
  PriorityScoring__P2Threshold: ${PRIORITY_P2_THRESHOLD:-50}
  PriorityScoring__P3Threshold: ${PRIORITY_P3_THRESHOLD:-25}

services:
  database:
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsepilot}
      POSTGRES_USER: ${POSTGRES_USER:-pulsepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - data
    pids_limit: ${DATABASE_PIDS_LIMIT:-256}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

  migration:
    <<: *app-hardening
    image: pulsepilot-migration:${IMAGE_TAG:-local}
    build: *migration-build
    pull_policy: never
    environment:
      <<: *api-environment
      Database__RunMigrations: "true"
      Seed__Run: ${SEED_DEMO_DATA:-false}
      Seed__Email: ${SEED_DEMO_EMAIL:-demo@pulsepilot.ai}
      Seed__Password: ${SEED_DEMO_PASSWORD:-change-me}
      Seed__FeedbackCount: ${SEED_FEEDBACK_COUNT:-100}
    depends_on:
      database:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1654,gid=1654
    networks:
      - data
    restart: "no"

  api:
    <<: *app-hardening
    image: pulsepilot-api:${IMAGE_TAG:-local}
    build: *api-build
    pull_policy: never
    environment:
      <<: *api-environment
      Database__RunMigrations: "false"
      Seed__Run: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1654,gid=1654
    networks:
      - app
      - data
    restart: unless-stopped
    stop_grace_period: 15s

  web:
    <<: *app-hardening
    image: pulsepilot-web:${IMAGE_TAG:-local}
    build: *web-build
    pull_policy: never
    environment:
      PULSEPILOT_API_URL: http://api:8080
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1001,gid=1001
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=1001,gid=1001
    networks:
      - app
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    <<: *app-hardening
    image: pulsepilot-worker:${IMAGE_TAG:-local}
    build: *worker-build
    pull_policy: never
    environment:
      <<: *api-environment
      FeedbackProcessing__Enabled: ${FEEDBACK_PROCESSING_ENABLED:-false}
      FeedbackProcessing__PollIntervalMilliseconds: ${FEEDBACK_PROCESSING_POLL_INTERVAL_MS:-1000}
      FeedbackProcessing__RecoveryIntervalSeconds: ${FEEDBACK_PROCESSING_RECOVERY_INTERVAL_SECONDS:-60}
      FeedbackProcessing__StaleProcessingThresholdMinutes: ${FEEDBACK_PROCESSING_STALE_THRESHOLD_MINUTES:-5}
      FeedbackProcessing__MaxAttempts: ${FEEDBACK_PROCESSING_MAX_ATTEMPTS:-3}
      FeedbackProcessing__AnalysisTimeoutSeconds: ${FEEDBACK_PROCESSING_TIMEOUT_SECONDS:-45}
      FeedbackProcessing__BaseRetryDelayMilliseconds: ${FEEDBACK_PROCESSING_BASE_RETRY_DELAY_MS:-500}
      FeedbackProcessing__MaxRetryDelaySeconds: ${FEEDBACK_PROCESSING_MAX_RETRY_DELAY_SECONDS:-5}
      FeedbackProcessing__RetryJitterFactor: ${FEEDBACK_PROCESSING_RETRY_JITTER_FACTOR:-0.2}
      FeedbackProcessing__MaxRecoveredPerSweep: ${FEEDBACK_PROCESSING_MAX_RECOVERED_PER_SWEEP:-100}
    depends_on:
      migration:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1654,gid=1654
    networks:
      - app
      - data
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-data:

networks:
  app:
  data:
    internal: true
