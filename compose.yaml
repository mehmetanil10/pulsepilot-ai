name: ${COMPOSE_PROJECT_NAME:-pulsepilot}

x-api-build: &api-build
  context: .
  dockerfile: Dockerfile
  target: final

x-worker-build: &worker-build
  context: .
  dockerfile: Dockerfile
  target: worker-final

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  ASPNETCORE_HTTP_PORTS: "8080"
  ConnectionStrings__Database: >-
    Host=database;Port=5432;Database=${POSTGRES_DB:-pulsepilot};Username=${POSTGRES_USER:-pulsepilot};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Include Error Detail=false
  Jwt__Issuer: ${JWT_ISSUER:-PulsePilot.Api}
  Jwt__Audience: ${JWT_AUDIENCE:-PulsePilot.Clients}
  Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
  Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
  OpenAI__Enabled: ${OPENAI_ENABLED:-false}
  OpenAI__ApiKey: ${OPENAI_API_KEY:-}
  OpenAI__Model: ${OPENAI_MODEL:-gpt-5.6-luna}
  OpenAI__EmbeddingModel: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  OpenAI__EmbeddingDimensions: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
  OpenAI__Endpoint: ${OPENAI_ENDPOINT:-https://api.openai.com/v1/}
  OpenAI__MaxOutputTokenCount: ${OPENAI_MAX_OUTPUT_TOKENS:-1000}
  OpenAI__NetworkTimeoutSeconds: ${OPENAI_NETWORK_TIMEOUT_SECONDS:-30}
  SemanticSearch__SimilarityThreshold: ${SIMILARITY_THRESHOLD:-0.80}
  SemanticSearch__DefaultLimit: ${SIMILARITY_DEFAULT_LIMIT:-10}
  SemanticSearch__MaxLimit: ${SIMILARITY_MAX_LIMIT:-50}
  FeedbackStatistics__DefaultPeriodDays: ${FEEDBACK_STATISTICS_DEFAULT_PERIOD_DAYS:-7}
  FeedbackStatistics__MaxPeriodDays: ${FEEDBACK_STATISTICS_MAX_PERIOD_DAYS:-365}
  PriorityScoring__SeverityWeight: ${PRIORITY_SEVERITY_WEIGHT:-0.35}
  PriorityScoring__FrequencyWeight: ${PRIORITY_FREQUENCY_WEIGHT:-0.30}
  PriorityScoring__CustomerImpactWeight: ${PRIORITY_CUSTOMER_IMPACT_WEIGHT:-0.20}
  PriorityScoring__RecencyWeight: ${PRIORITY_RECENCY_WEIGHT:-0.15}
  PriorityScoring__FrequencyNormalizationCount: ${PRIORITY_FREQUENCY_NORMALIZATION_COUNT:-20}
  PriorityScoring__CustomerImpactNormalizationCount: ${PRIORITY_CUSTOMER_IMPACT_NORMALIZATION_COUNT:-10}
  PriorityScoring__RecencyWindowDays: ${PRIORITY_RECENCY_WINDOW_DAYS:-7}
  PriorityScoring__P1Threshold: ${PRIORITY_P1_THRESHOLD:-75}
  PriorityScoring__P2Threshold: ${PRIORITY_P2_THRESHOLD:-50}
  PriorityScoring__P3Threshold: ${PRIORITY_P3_THRESHOLD:-25}

services:
  database:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsepilot}
      POSTGRES_USER: ${POSTGRES_USER:-pulsepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migration:
    image: pulsepilot-api:${IMAGE_TAG:-local}
    build: *api-build
    environment:
      <<: *api-environment
      Database__RunMigrations: "true"
      Seed__Run: ${SEED_DEMO_DATA:-false}
      Seed__Email: ${SEED_DEMO_EMAIL:-demo@pulsepilot.ai}
      Seed__Password: ${SEED_DEMO_PASSWORD:-change-me}
      Seed__FeedbackCount: ${SEED_FEEDBACK_COUNT:-100}
    depends_on:
      database:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    image: pulsepilot-api:${IMAGE_TAG:-local}
    pull_policy: never
    environment:
      <<: *api-environment
      Database__RunMigrations: "false"
      Seed__Run: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    image: pulsepilot-worker:${IMAGE_TAG:-local}
    build: *worker-build
    environment:
      <<: *api-environment
      FeedbackProcessing__Enabled: ${FEEDBACK_PROCESSING_ENABLED:-false}
      FeedbackProcessing__PollIntervalMilliseconds: ${FEEDBACK_PROCESSING_POLL_INTERVAL_MS:-1000}
      FeedbackProcessing__RecoveryIntervalSeconds: ${FEEDBACK_PROCESSING_RECOVERY_INTERVAL_SECONDS:-60}
      FeedbackProcessing__StaleProcessingThresholdMinutes: ${FEEDBACK_PROCESSING_STALE_THRESHOLD_MINUTES:-5}
      FeedbackProcessing__MaxAttempts: ${FEEDBACK_PROCESSING_MAX_ATTEMPTS:-3}
      FeedbackProcessing__AnalysisTimeoutSeconds: ${FEEDBACK_PROCESSING_TIMEOUT_SECONDS:-45}
      FeedbackProcessing__BaseRetryDelayMilliseconds: ${FEEDBACK_PROCESSING_BASE_RETRY_DELAY_MS:-500}
      FeedbackProcessing__MaxRetryDelaySeconds: ${FEEDBACK_PROCESSING_MAX_RETRY_DELAY_SECONDS:-5}
      FeedbackProcessing__RetryJitterFactor: ${FEEDBACK_PROCESSING_RETRY_JITTER_FACTOR:-0.2}
      FeedbackProcessing__MaxRecoveredPerSweep: ${FEEDBACK_PROCESSING_MAX_RECOVERED_PER_SWEEP:-100}
    depends_on:
      migration:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-data:
