name: Live demo smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS origin of the deployed PulsePilot Web service
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-demo-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Public demo smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: live-demo
    env:
      DEMO_BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate public demo
        shell: pwsh
        run: ./scripts/smoke-deployment.ps1 -BaseUrl $env:DEMO_BASE_URL
