# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: pulsepilot-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Database
        fromDatabase:
          name: pulsepilot-postgres
          property: connectionString
      - key: Database__RunMigrations
        value: "true"
      - key: Database__ExitAfterInitialization
        value: "false"
      - key: Seed__Run
        value: "true"
      - key: Seed__Email
        value: demo@pulsepilot.ai
      - key: Seed__Password
        sync: false
      - key: Seed__FeedbackCount
        value: "100"
      - key: Jwt__Issuer
        value: PulsePilot.Render
      - key: Jwt__Audience
        value: PulsePilot.Web
      - key: Jwt__Secret
        generateValue: true
      - key: OpenAI__Enabled
        value: "true"
      - key: OpenAI__ApiKey
        sync: false
      - key: OpenAI__Model
        value: gpt-5.6-luna
      - key: OpenAI__EmbeddingModel
        value: text-embedding-3-small
      - key: OpenAI__EmbeddingDimensions
        value: "1536"
      - key: OpenAI__MaxOutputTokenCount
        value: "1000"
      - key: OpenAI__NetworkTimeoutSeconds
        value: "30"
      - key: OpenTelemetry__OtlpEnabled
        value: "false"
      - key: FeedbackProcessing__Enabled
        value: "true"
      - key: FeedbackProcessing__PollIntervalMilliseconds
        value: "1000"
      - key: FeedbackProcessing__RecoveryIntervalSeconds
        value: "60"
      - key: FeedbackProcessing__StaleProcessingThresholdMinutes
        value: "5"
      - key: FeedbackProcessing__MaxAttempts
        value: "3"
      - key: FeedbackProcessing__AnalysisTimeoutSeconds
        value: "45"
      - key: FeedbackProcessing__BaseRetryDelayMilliseconds
        value: "500"
      - key: FeedbackProcessing__MaxRetryDelaySeconds
        value: "5"
      - key: FeedbackProcessing__RetryJitterFactor
        value: "0.2"
      - key: FeedbackProcessing__MaxRecoveredPerSweep
        value: "100"
      - key: ApiProtection__RateLimitingEnabled
        value: "true"
      - key: ApiProtection__GeneralPermitLimit
        value: "240"
      - key: ApiProtection__AuthenticationPermitLimit
        value: "10"
      - key: ApiProtection__AiPermitLimit
        value: "20"
      - key: ApiProtection__WindowSeconds
        value: "60"
      - key: ApiProtection__QueueLimit
        value: "0"
      - key: ApiProtection__MaxRequestBodyBytes
        value: "65536"

  - type: web
    name: pulsepilot-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./src/PulsePilot.Web/Dockerfile
    dockerContext: ./src/PulsePilot.Web
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PULSEPILOT_API_URL
        fromService:
          type: web
          name: pulsepilot-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: pulsepilot-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: pulsepilot
    user: pulsepilot
    ipAllowList: []
